<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NutriSwim — Training Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriSwim">
<meta name="theme-color" content="#0d2240">
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── THEME ── */
:root{
  --bg:#eef4fb;--bg2:#ddeaf6;--surface:#ffffff;--surface2:#f2f7fd;
  --border:#b0cde8;--text:#0a1e36;--text2:#2a4a6a;--text3:#6a8faa;
  --accent:#1252a3;--accent2:#1a6bc7;
  --sidebar:#0d2240;--sidebar2:#162d4e;--sidebar-text:#c8dff5;--sidebar-text2:#6a9dc0;
  --shadow:0 2px 16px rgba(18,82,163,.12);--shadow2:0 6px 28px rgba(18,82,163,.20);
  --str:#c0392b;--str-l:#e74c3c;--str-bg:#fde8e8;
  --pow:#d35400;--pow-l:#e67e22;--pow-bg:#fef3e2;
  --mob:#1e8449;--mob-l:#27ae60;--mob-bg:#e9fbe9;
  --pool:#1a7ab5;--pool-l:#2980b9;--pool-bg:#e3f4fc;
  --rest:#7f8c8d;--rest-l:#95a5a6;--rest-bg:#f0f0f2;
  --done-bg:#d4edda;--done-border:#27ae60;
  --sidebar-w:240px;
}
[data-theme="dark"]{
  --bg:#060f1a;--bg2:#0a1728;--surface:#0d1f33;--surface2:#122840;
  --border:#1a3050;--text:#cce0f5;--text2:#6a9dc0;--text3:#304a65;
  --accent:#3d8fd6;--accent2:#2070b8;
  --sidebar:#020b14;--sidebar2:#0a1828;--sidebar-text:#a0c8e8;--sidebar-text2:#3a6a88;
  --shadow:0 2px 16px rgba(0,0,0,.5);--shadow2:0 6px 28px rgba(0,0,0,.6);
  --str:#e74c3c;--str-l:#c0392b;--str-bg:#1e0808;
  --pow:#e67e22;--pow-l:#d35400;--pow-bg:#1e1000;
  --mob:#27ae60;--mob-l:#1e8449;--mob-bg:#081a08;
  --pool:#2980b9;--pool-l:#1a7ab5;--pool-bg:#041420;
  --rest:#7f8c8d;--rest-l:#606b6b;--rest-bg:#0e0e10;
  --done-bg:#0a2010;--done-border:#27ae60;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'League Spartan',sans-serif;min-height:100vh;display:flex;}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,textarea{font-family:'League Spartan',sans-serif;background:var(--surface2);color:var(--text);border:1.5px solid var(--border);border-radius:7px;transition:border-color .2s;}
input:focus,textarea:focus{outline:none;border-color:var(--accent);}
button{cursor:pointer;font-family:'League Spartan',sans-serif;}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);min-height:100vh;
  background:var(--sidebar);
  display:flex;flex-direction:column;
  position:fixed;left:0;top:0;bottom:0;
  z-index:100;transition:width .3s;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar-logo{
  padding:20px 16px 18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-logo img{
  width:130px;height:130px;border-radius:50%;
  object-fit:cover;object-position:center center;
  border:3px solid rgba(255,255,255,.15);
  background:#b8e0f5;padding:0;
  display:block;
}
.sidebar-logo-name{
  font-size:20px;font-weight:900;letter-spacing:1.5px;
  color:#fff;text-align:center;line-height:1.1;
  font-family:'League Spartan',sans-serif;
}
.sidebar-logo-sub{
  font-size:9px;letter-spacing:4px;color:var(--sidebar-text2);
  text-align:center;margin-top:2px;text-transform:uppercase;font-weight:500;
}
.sidebar-nav{flex:1;padding:20px 12px;display:flex;flex-direction:column;gap:4px;}
.snav-btn{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-radius:10px;border:none;
  background:transparent;color:var(--sidebar-text2);
  font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  transition:all .2s;width:100%;text-align:left;
}
.snav-btn:hover{background:rgba(255,255,255,.08);color:var(--sidebar-text);}
.snav-btn.active{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(18,82,163,.4);}
.snav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.sidebar-bottom{
  padding:16px 12px;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;flex-direction:column;gap:10px;
}
.sync-badge{font-size:10px;letter-spacing:2px;color:var(--sidebar-text2);text-align:center;font-weight:600;}
.sync-badge.saving{color:#3d8fd6;}

/* Dark/light toggle with sun/moon */
.theme-wrap{display:flex;align-items:center;justify-content:center;gap:10px;}
.theme-label{font-size:11px;color:var(--sidebar-text2);font-weight:600;letter-spacing:1px;}
.tbtn{
  width:56px;height:28px;background:rgba(255,255,255,.12);
  border:1.5px solid rgba(255,255,255,.15);border-radius:14px;
  position:relative;cursor:pointer;padding:0;transition:all .3s;
  display:flex;align-items:center;
}
.tbtn.dark{background:rgba(61,143,214,.3);border-color:var(--accent);}
.tbtn-track{
  position:absolute;inset:0;display:flex;align-items:center;
  justify-content:space-between;padding:0 5px;pointer-events:none;
}
.tbtn-moon{font-size:12px;opacity:.5;transition:opacity .3s;}
.tbtn-sun{font-size:12px;opacity:.5;transition:opacity .3s;}
.tbtn.dark .tbtn-moon{opacity:1;}
.tbtn:not(.dark) .tbtn-sun{opacity:1;}
.tbtn-thumb{
  position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:#fff;transition:transform .3s;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}
.tbtn.dark .tbtn-thumb{transform:translateX(28px);}

/* ── MAIN CONTENT ── */
.main{
  margin-left:var(--sidebar-w);flex:1;
  min-height:100vh;
  display:flex;flex-direction:column;
}


/* ── VIEWS ── */
.view{display:none;padding:26px 28px;width:100%;}
.view.active{display:block;}

/* ── BUTTONS ── */
.btn{padding:8px 18px;font-size:11px;letter-spacing:2px;font-weight:700;border-radius:8px;border:1.5px solid var(--border);background:transparent;color:var(--text2);transition:all .18s;text-transform:uppercase;}
.btn:hover{border-color:var(--accent);color:var(--accent);}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.primary:hover{background:var(--accent2);}
.btn.sm{padding:5px 13px;font-size:11px;}
.btn.danger{border-color:#e74c3c;color:#e74c3c;}
.nav-arr{background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);width:36px;height:36px;border-radius:9px;font-size:20px;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;}
.nav-arr:hover{border-color:var(--accent);color:var(--accent);}
.micro{padding:2px 7px;font-size:10px;background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:4px;transition:all .15s;font-weight:600;}
.micro:hover{border-color:var(--accent);color:var(--accent);}

/* ── CALENDAR ── */
.cal-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.cal-title{font-size:24px;font-weight:900;letter-spacing:2px;}
.dh-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.dh-cell{text-align:center;font-size:10px;letter-spacing:3px;color:var(--text3);padding:4px 0;font-weight:700;}
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}

/* Cell with double workout split */
.cal-cell{
  border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface);min-height:86px;
  position:relative;cursor:pointer;transition:all .18s;
  overflow:hidden;
}
.cal-cell:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
.cal-cell.today{outline:2.5px solid var(--accent);outline-offset:1px;}
.cal-cell.done-cell{border-color:var(--done-border)!important;}

/* Split background for double workout */
.cell-bg{position:absolute;inset:0;display:flex;pointer-events:none;border-radius:10px;overflow:hidden;}
.cell-bg-half{flex:1;min-width:0;}
.cell-bg-half:first-child{border-radius:10px 0 0 10px;}
.cell-bg-half:last-child{border-radius:0 10px 10px 0;}

/* Cell content on top */
.cell-content{position:relative;z-index:2;padding:7px;height:100%;display:flex;flex-direction:column;}
.cell-top{display:flex;align-items:flex-start;justify-content:space-between;}
.cnum{font-size:13px;font-weight:800;color:var(--text2);}
.cnum.tod{color:var(--accent);}
.done-btn{
  width:18px;height:18px;border-radius:4px;
  border:2px solid rgba(0,0,0,.15);background:rgba(255,255,255,.7);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:900;transition:all .2s;flex-shrink:0;
  z-index:3;
}
.done-btn.checked{background:#27ae60;border-color:#27ae60;color:#fff;animation:pulse-green .5s ease-out;}
@keyframes fadeSlideIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes pulse-green{0%{box-shadow:0 0 0 0 rgba(39,174,96,.7);}70%{box-shadow:0 0 0 8px rgba(39,174,96,0);}100%{box-shadow:0 0 0 0 rgba(39,174,96,0);}}
/* Done cell star overlay */
.cal-cell.done-cell{border:3px solid #27ae60 !important;box-shadow:0 0 14px rgba(39,174,96,.5) !important;}
.cal-cell.done-cell .cell-bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,.35);border-radius:10px;
  pointer-events:none;z-index:1;
}
.cal-cell.done-cell .cell-icons{z-index:3 !important;}
.cal-cell.done-cell .cell-content{z-index:2;}
.done-star{
  display:none;position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:26px;z-index:10;pointer-events:none;
  filter:drop-shadow(0 0 6px rgba(255,215,0,.8));
}
.cal-cell.done-cell .done-star{display:block;}
.wk-cell.done-cell{border:3px solid #27ae60 !important;box-shadow:0 0 14px rgba(39,174,96,.5) !important;}
.wk-cell.done-cell .wk-bg::after{
  content:'';position:absolute;inset:0;
  background:rgba(0,0,0,.35);border-radius:11px;
  pointer-events:none;z-index:1;
}
.wk-done-star{
  display:none;position:absolute;
  top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:36px;z-index:10;pointer-events:none;
  filter:drop-shadow(0 0 8px rgba(255,215,0,.8));
}
.wk-cell.done-cell .wk-done-star{display:block;}
.cell-icons{display:flex;gap:4px;margin-top:4px;flex:1;align-items:center;justify-content:center;}
.cell-icon{font-size:28px;line-height:1;}
.cell-subtype{font-size:9px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.cell-actions{display:flex;gap:2px;margin-top:auto;justify-content:flex-end;}
.edit-btn{opacity:0;transition:opacity .2s;}
.cal-cell:hover .edit-btn{opacity:1;}
.wk-cell:hover .edit-btn{opacity:1;}

/* Add second workout button - shows on hover */
.add-second-btn{
  position:absolute;bottom:6px;left:6px;z-index:4;
  width:22px;height:22px;border-radius:6px;
  background:var(--accent);color:#fff;border:none;
  font-size:14px;font-weight:900;
  display:none;align-items:center;justify-content:center;
  transition:all .18s;box-shadow:0 2px 8px rgba(18,82,163,.4);
  line-height:1;
}
.cal-cell:hover .add-second-btn{display:flex;}
.add-second-btn:hover{transform:scale(1.15);}

/* Week */
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
.wk-cell{border:1.5px solid var(--border);border-radius:11px;background:var(--surface);min-height:165px;position:relative;cursor:pointer;transition:all .18s;overflow:hidden;}
.wk-cell:hover{box-shadow:var(--shadow2);transform:translateY(-2px);}
.wk-cell.today{outline:2.5px solid var(--accent);}
.wk-bg{position:absolute;inset:0;display:flex;pointer-events:none;border-radius:11px;overflow:hidden;}
.wk-bg-half{flex:1;min-width:0;}
.wk-bg-half:first-child{border-radius:11px 0 0 11px;}
.wk-bg-half:last-child{border-radius:0 11px 11px 0;}
.wk-content{position:relative;z-index:2;padding:14px;height:100%;}
.wdlbl{font-size:9px;letter-spacing:3px;color:var(--text3);margin-bottom:4px;font-weight:700;}
.wdnum{font-size:26px;font-weight:900;}

/* Picker overlay */
.picker-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;}
.picker{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.tpill{padding:10px 16px;font-size:11px;letter-spacing:1px;font-weight:800;border-radius:22px;border:2px solid;transition:all .15s;text-align:left;}
.tpill:hover{filter:brightness(1.1);transform:scale(1.02);}

/* Calendar legend */
.cal-legend{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px;}
.legend-card{border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:5px;border:none;}
.legend-icon{font-size:26px;line-height:1;}
.legend-name{font-size:11px;font-weight:800;letter-spacing:2px;color:#fff;text-transform:uppercase;}
.legend-desc{font-size:9px;color:rgba(255,255,255,.75);font-weight:500;text-align:center;line-height:1.3;}

/* ── TRAINING HUB ── */
.hub-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px;}
.hub-card{border-radius:16px;padding:26px 14px 20px;cursor:pointer;transition:all .22s;text-align:center;position:relative;overflow:hidden;border:none;box-shadow:0 6px 20px rgba(0,0,0,.15);}
.hub-card:hover{transform:translateY(-5px);box-shadow:0 14px 36px rgba(0,0,0,.22);}
.hub-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.12);}
.hub-icon{font-size:44px;margin-bottom:8px;display:block;}
.hub-num{font-size:34px;font-weight:900;color:#fff;display:block;line-height:1;}
.hub-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:3px;margin-top:4px;display:block;}
.hub-last{font-size:10px;color:rgba(255,255,255,.6);margin-top:8px;font-weight:500;}
.hub-bar-wrap{margin-top:10px;background:rgba(0,0,0,.2);border-radius:4px;height:5px;overflow:hidden;}
.hub-bar-fill{height:100%;background:rgba(255,255,255,.4);border-radius:4px;transition:width .6s;}

/* Sub-type */
.subtype-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.subtype-btn{padding:9px 18px;font-size:12px;font-weight:800;border-radius:8px;border:2px solid var(--str);color:var(--str);background:var(--str-bg);cursor:pointer;transition:all .18s;letter-spacing:1px;}
.subtype-btn:hover,.subtype-btn.active{background:var(--str);color:#fff;}

/* Session list */
.sess-list{display:flex;flex-direction:column;gap:10px;}
.sess-card{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;overflow:hidden;transition:all .18s;}
.sess-card:hover{box-shadow:var(--shadow);}
.sess-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer;}
.sess-date{font-size:11px;letter-spacing:2px;font-weight:700;}
.sess-name{font-size:16px;font-weight:800;margin-top:2px;}
.sess-arrow{font-size:17px;color:var(--text3);transition:transform .2s;}
.sess-arrow.open{transform:rotate(90deg);}
.sess-body{display:none;padding:0 18px 18px;}
.sess-body.open{display:block;}
.ex-group{margin-bottom:14px;}
.ex-group-head{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--bg2);border-radius:9px;cursor:pointer;}
.ex-group-name{font-size:13px;font-weight:800;letter-spacing:1px;}
.ex-group-arrow{font-size:14px;color:var(--text3);transition:transform .2s;}
.ex-group-arrow.open{transform:rotate(90deg);}
.ex-dates-list{display:none;background:var(--surface2);border-radius:0 0 9px 9px;overflow:hidden;}
.ex-dates-list.open{display:block;}
.ex-date-row{display:grid;grid-template-columns:100px 1fr 80px 80px;gap:8px;align-items:center;padding:8px 13px;border-bottom:1px solid var(--border);font-size:11px;}
.ex-date-row:last-child{border-bottom:none;}
.ex-date-lbl{font-weight:700;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.ex-sets-inline{display:flex;gap:5px;flex-wrap:wrap;}
.set-tag{padding:2px 8px;border-radius:5px;background:var(--bg2);font-size:10px;font-family:'JetBrains Mono',monospace;font-weight:600;}
.set-tag.up{background:#d4edda;color:#145a32;}
.set-tag.down{background:#fde8e8;color:#922b21;}
.pool-table{width:100%;border-collapse:collapse;font-size:12px;}
.pool-table th{text-align:left;padding:9px 13px;background:var(--pool-bg);font-size:10px;letter-spacing:2px;font-weight:800;color:var(--pool);border-bottom:2px solid var(--pool);}
.pool-table td{padding:9px 13px;border-bottom:1px solid var(--border);font-family:'JetBrains Mono',monospace;}
.pool-table tr:hover td{background:var(--bg2);}

/* Workout detail */
.wk-topbar{display:flex;align-items:center;gap:16px;margin-bottom:26px;flex-wrap:wrap;}
.wk-date-lbl{font-size:11px;color:var(--text3);letter-spacing:3px;font-weight:700;}
.wk-type-lbl{font-size:32px;font-weight:900;letter-spacing:3px;}
.wk-sname{font-size:14px;color:var(--text2);margin-top:2px;font-weight:600;}
.excard{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:18px 18px 18px 20px;margin-bottom:13px;overflow:visible;}
.exhead{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-left:2px;}
.exname{font-size:14px;font-weight:800;background:transparent;border:none;color:var(--text);flex:1;padding:2px 0 2px 2px;}
.exname:focus{outline:none;border-bottom:2px solid var(--accent);}
.shdr{display:grid;grid-template-columns:36px 1fr 90px 110px 28px;gap:6px;font-size:9px;color:var(--text3);letter-spacing:2px;margin:8px 0 5px;font-weight:700;}
.srow{display:grid;grid-template-columns:36px 1fr 90px 110px 28px;gap:6px;align-items:center;margin-bottom:7px;}
.slbl{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;font-weight:600;}
.sinp{width:100%;padding:7px 28px 7px 9px;border-radius:7px;background:var(--surface2);border:1.5px solid var(--border);color:var(--text);font-size:12px;font-family:'JetBrains Mono',monospace;transition:border-color .2s;}
.sinp:focus{outline:none;border-color:var(--accent);}
.sinp.up{border-color:#27ae60;}.sinp.down{border-color:#e74c3c;}
.swrap{position:relative;}
.sarr{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;pointer-events:none;}
.sprev{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exfooter{display:flex;gap:8px;align-items:center;margin-top:11px;}
.extrain{flex:1;padding:7px 11px;border-radius:7px;background:var(--surface2);border:1.5px solid var(--border);color:var(--text2);font-size:11px;}
.poolcard{background:var(--surface);border:2px solid var(--pool);border-radius:11px;padding:22px;}
.pfield{display:grid;grid-template-columns:140px 1fr 100px;gap:12px;align-items:center;margin-bottom:13px;}
.plbl{font-size:10px;letter-spacing:2px;font-weight:800;color:var(--pool);}
.pinp{padding:9px 13px;border-radius:7px;width:100%;font-size:13px;font-family:'JetBrains Mono',monospace;}
.pprev{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.psumm{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:18px;margin-top:22px;}
.psttl{font-size:9px;letter-spacing:3px;color:var(--text3);margin-bottom:13px;font-weight:800;}
.psrow{display:flex;gap:22px;align-items:center;}
.psstat{text-align:center;}
.psnum{font-size:28px;font-weight:900;}
.pslbl{font-size:9px;letter-spacing:1px;font-weight:700;margin-top:1px;}
.psbar{flex:1;height:7px;background:var(--bg2);border-radius:4px;overflow:hidden;display:flex;}

/* Progress */
.prog-title{font-size:26px;font-weight:900;letter-spacing:2px;margin-bottom:20px;}
.prog-layout{display:grid;grid-template-columns:210px 1fr;gap:18px;}
.exlpanel{display:flex;flex-direction:column;gap:5px;}
.exllbl{font-size:9px;letter-spacing:3px;color:var(--text3);margin-bottom:7px;font-weight:800;}
.exlbtn{padding:10px 13px;text-align:left;font-size:11px;letter-spacing:1px;font-weight:700;background:transparent;border:1.5px solid var(--border);color:var(--text2);border-radius:7px;transition:all .15s;}
.exlbtn:hover{border-color:var(--accent);color:var(--accent);}
.exlbtn.active{background:var(--surface2);}
.chbox{background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:24px;}
.chtitle{font-size:14px;font-weight:900;letter-spacing:2px;margin-bottom:20px;}
.barchart{display:flex;align-items:flex-end;gap:7px;height:140px;margin-bottom:14px;}
.bwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:18px;}
.bvlbl{font-size:14px;font-family:'JetBrains Mono',monospace;text-align:center;white-space:nowrap;font-weight:800;}
.bseg{width:100%;border-radius:5px 5px 0 0;position:relative;min-height:4px;transition:height .4s;}
.barrow{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;}
.drow{display:flex;gap:7px;}
.dcell{flex:1;font-size:9px;color:var(--text3);text-align:center;font-family:'JetBrains Mono',monospace;font-weight:600;}
.chstats{display:flex;gap:26px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
.cslbl{font-size:9px;color:var(--text3);letter-spacing:2px;font-weight:700;}
.csval{font-size:20px;font-weight:900;margin-top:2px;}

/* Toast */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(14px);padding:11px 28px;border-radius:9px;font-weight:800;letter-spacing:2px;font-size:12px;z-index:999;opacity:0;transition:all .25s;pointer-events:none;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.25);}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}



/* ── MOBILE ── */
.mobile-nav{display:none;}

@media(max-width:768px){
  :root{--sidebar-w:0px;}
  *{-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    width:100%;
    overflow-x:hidden;
  }
  body{
    flex-direction:column;
    min-height:100vh;
    overflow-y:auto;
  }
  .sidebar{display:none !important;width:0 !important;min-width:0 !important;position:absolute;}
  .main{
    margin-left:0 !important;
    width:100% !important;
    max-width:100vw !important;
    flex:1;
    display:flex;flex-direction:column;
    padding-bottom:70px;
    overflow-x:hidden;
    position:relative;
  }
  /* Calendar redesign mobile */
  .view{
    padding:14px 12px 20px;
    width:100%;max-width:100%;
    overflow-x:hidden;
    box-sizing:border-box;
    display:none;
  }
  .view.active{
    display:block !important;
    padding-top:10px !important;
  }

  /* ── MOBILE CALENDAR ── */
  .cal-topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:16px;padding:0 2px;
    flex-wrap:nowrap;gap:6px;
  }
  .cal-title{
    font-size:20px;font-weight:900;letter-spacing:2px;
    color:var(--accent);text-align:center;flex:1;
  }
  .nav-arr{
    width:34px;height:34px;border-radius:50%;font-size:18px;
    background:var(--surface2);border:1.5px solid var(--border);
    color:var(--accent);flex-shrink:0;
  }
  .cal-topbar > div:last-child{
    display:flex;flex-wrap:wrap;gap:5px;justify-content:center;
    width:100%;margin-top:6px;
  }
  .btn{padding:6px 12px;font-size:10px;letter-spacing:1px;border-radius:20px;}

  /* Day header row */
  .dh-row{
    display:grid !important;
    grid-template-columns:repeat(7,1fr);
    gap:0;margin-bottom:6px;
    background:var(--surface);
    border-radius:12px;padding:6px 0;
  }
  .dh-cell{
    text-align:center;font-size:11px;font-weight:700;
    color:var(--text3);padding:4px 0;letter-spacing:0;
  }

  /* Calendar grid - bigger cells, rounder, more spaced */
  .cal-month{
    display:grid !important;
    grid-template-columns:repeat(7,1fr);
    gap:4px;width:100%;
  }
  .cal-cell{
    min-height:48px;border-radius:12px;
    padding:5px 4px 4px;
    border:1.5px solid var(--border);
    position:relative;cursor:pointer;
  }
  .cal-cell.today{outline:2.5px solid var(--accent);outline-offset:1px;}
  .cell-content{padding:0;}
  .cnum{font-size:13px;font-weight:800;display:block;text-align:center;line-height:1.2;}
  .cell-icon{font-size:18px !important;line-height:1;}
  .cell-icons{
    display:flex !important;justify-content:center !important;
    align-items:center !important;margin-top:2px !important;gap:1px;
  }
  .cell-subtype{font-size:7px;text-align:center;}
  .cell-top{display:flex;justify-content:center;align-items:center;position:relative;}
  .done-btn{
    position:absolute;top:2px;right:2px;
    width:14px;height:14px;font-size:7px;border-radius:3px;
  }
  .add-second-btn{width:14px;height:14px;font-size:10px;bottom:2px;left:2px;}
  .cell-actions{bottom:2px;right:2px;gap:1px;}
  .edit-btn{opacity:0;}
  .cal-cell:active .edit-btn{opacity:1;}
  .micro{padding:1px 3px;font-size:8px;}

  /* Legend */
  .cal-legend{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:6px;margin-top:16px;
  }
  .legend-card{padding:10px 6px;border-radius:10px;}
  .legend-icon{font-size:20px;}
  .legend-name{font-size:10px;letter-spacing:1px;}
  .legend-desc{display:none;}

  /* Training */
  .hub-grid{grid-template-columns:repeat(2,1fr) !important;gap:10px;}
  .hub-card{padding:20px 10px 16px;border-radius:14px;}
  .hub-icon{font-size:32px;margin-bottom:6px;}
  .hub-label{font-size:11px;letter-spacing:2px;}

  /* Progress */
  .prog-layout{grid-template-columns:1fr !important;}
  #progCatCards{grid-template-columns:repeat(2,1fr) !important;gap:8px !important;}
  .prog-title{font-size:20px;margin-bottom:14px;}

  /* Workout detail */
  .shdr,.srow{grid-template-columns:28px 1fr 65px 70px 20px;}
  .sinp{font-size:11px;padding:5px 20px 5px 6px;}
  .pfield{grid-template-columns:85px 1fr 60px;}
  .wk-type-lbl{font-size:22px;}
  .excard{padding:12px;}

  /* Week view */
  .cal-week{grid-template-columns:repeat(2,1fr) !important;gap:6px;}
  .wk-cell{min-height:120px;padding:10px;}
  .wdnum{font-size:22px;}

  /* Session list */
  .ex-date-row{grid-template-columns:80px 1fr 55px 55px;font-size:10px;}

  /* Mobile bottom nav */
  .mobile-nav{
    display:flex !important;
    position:fixed;bottom:0;left:0;right:0;z-index:500;
    background:var(--sidebar);
    border-top:1px solid rgba(255,255,255,.12);
    height:64px;
    padding:0 8px;
    padding-bottom:env(safe-area-inset-bottom,0px);
    align-items:center;justify-content:space-around;
    box-shadow:0 -4px 20px rgba(0,0,0,.3);
  }
  .mobile-nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:2px;
    background:transparent;border:none;
    color:var(--sidebar-text2);
    font-size:10px;font-weight:700;letter-spacing:1px;
    padding:6px 14px;border-radius:10px;
    transition:all .2s;cursor:pointer;
    font-family:'League Spartan',sans-serif;
  }
  .mobile-nav-btn.active{color:#fff;background:rgba(61,143,214,.25);}
  .mobile-nav-btn .mnav-icon{font-size:22px;line-height:1;}
  .mobile-theme-btn{
    width:40px;height:40px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:12px;font-size:20px;
    cursor:pointer;color:white;
    display:flex;align-items:center;justify-content:center;
  }
  /* Pickers full width on mobile */
  .picker{max-width:calc(100vw - 24px) !important;width:100%;}
  .picker-overlay{padding:20px 12px !important;align-items:center !important;}
  #addExOverlay{padding:16px !important;}
  #addExOverlay > div:nth-child(2){
    max-width:100% !important;
    max-height:90vh !important;
    margin:0 !important;
    border-radius:16px !important;
    padding:16px !important;
  }
  #exPickerGrid{grid-template-columns:repeat(2,1fr) !important;}
}

@media(min-width:769px) and (max-width:1024px){
  :root{--sidebar-w:70px;}
  .sidebar-logo{padding:16px 8px;}
  .sidebar-logo img{width:46px;height:46px;}
  .sidebar-logo-name,.sidebar-logo-sub{display:none;}
  .snav-btn{padding:14px;justify-content:center;}
  .snav-btn span:not(.snav-icon){display:none;}
  .sidebar-bottom{padding:10px 6px;align-items:center;}
  .theme-label{display:none;}
}

@media(max-width:768px){
  /* Minimal calendar - circles */
  .cal-month{gap:6px !important;padding:4px 0;}
  .cal-cell{
    min-height:42px !important;
    border-radius:50% !important;
    width:42px;height:42px;
    margin:0 auto;
    display:flex !important;
    align-items:center;justify-content:center;
    padding:0 !important;
    border:2px solid transparent !important;
    position:relative;
  }
  .cal-cell.today{
    outline:none !important;
    border:2.5px solid var(--accent) !important;
  }
  .cal-cell.done-cell{
    border-color:var(--done-border) !important;
  }
  .cell-content{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
    padding:0 !important;
    position:relative;
  }
  .cell-top{
    display:flex;align-items:center;justify-content:center;
    width:100%;height:100%;
  }
  .cnum{
    font-size:14px !important;font-weight:800;
    text-align:center;line-height:1;
    z-index:2;position:relative;
  }
  /* Hide icons, actions, star in mobile cal */
  .cell-icons,.cell-actions,.done-star,.cell-subtype,.add-second-btn{
    display:none !important;
  }
  /* Done button as tiny dot */
  .done-btn{
    position:absolute;bottom:-4px;right:50%;transform:translateX(50%);
    width:8px;height:8px;border-radius:50%;
    border:1px solid rgba(255,255,255,.5) !important;
    font-size:0 !important;
    background:transparent;
    display:block !important;
  }
  .done-btn.checked{
    background:#27ae60 !important;
    border-color:#27ae60 !important;
  }
  /* Colored cell bg for training types */
  .cal-cell[data-type]{background:var(--cell-color,var(--surface));}
  /* Day headers */
  .dh-row{background:transparent !important;padding:2px 0 !important;margin-bottom:8px !important;}
  .dh-cell{font-size:11px !important;font-weight:700;color:var(--text3);}
  /* Cal grid wrapper */
  .cal-month-wrap{
    background:var(--surface);
    border-radius:16px;
    padding:12px;
    box-shadow:var(--shadow);
  }
  /* Legend mobile */
  .cal-legend{
    background:var(--surface);
    border-radius:12px;
    padding:12px;
    margin-top:12px;
  }
}
</style>

function mk(y,m,d){return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');}
function pk(k){const[y,m,d]=k.split('-');return{y:+y,m:+m-1,d:+d};}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function fdow(y,m){let d=new Date(y,m,1).getDay();return d===0?6:d-1;}
function gdow(dt){let d=dt.getDay();return d===0?6:d-1;}
function todayK(){const t=new Date();return mk(t.getFullYear(),t.getMonth(),t.getDate());}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,col='#1252a3'){const t=document.getElementById('toast');t.textContent=msg;t.style.background=col;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function parseS(s){if(!s)return null;const m=String(s).match(/^(\d+(?:\.\d+)?)[xX](\d+(?:\.\d+)?)$/);if(m)return{w:+m[1],r:+m[2]};const n=+s;if(!isNaN(n))return{w:0,r:n};return null;}
function cmpS(a,b){const c=parseS(a),p=parseS(b);if(!c||!p)return'n';if(c.w>p.w||c.r>p.r)return'u';if(c.w<p.w||c.r<p.r)return'd';return'n';}
function cmpR(a,b){if(!a||!b)return'n';const c=+a,p=+b;if(isNaN(c)||isNaN(p))return'n';if(c<p)return'u';if(c>p)return'd';return'n';}
function arrHTML(p){if(p==='u')return'<span class="sarr" style="color:#27ae60">▲</span>';if(p==='d')return'<span class="sarr" style="color:#e74c3c">▼</span>';return'';}

function closePicker(){const ov=document.getElementById('pickerOverlay');if(ov)ov.remove();editKey=null;}

function setType(k,slot,type){
  if(!DB[k])DB[k]={};
  const e=DB[k];
  const T=TYPES[type];
  if(slot===1){
    e.type=type;
    if(!e.exercises)e.exercises=[];
    if(!e.pool&&type==='pool')e.pool={warmUp:'',training:'',coolDown:'',meters:'',time:'',pace:''};
  } else {
    e.type2=type;
    if(!e.exercises2)e.exercises2=[];
    if(!e.pool2&&type==='pool')e.pool2={warmUp:'',training:'',coolDown:'',meters:'',time:'',pace:''};
  }
  if(type==='strength'){showPickerModal(k,slot);return;}
  closePicker();save();renderCal();
  toast(T.icon+' '+T.label+' saved','#1252a3');
}
function confirmPicker(k,slot){
  if(!DB[k])DB[k]={};
  const e=DB[k];
  const key=slot===1?e.type:e.type2;
  if(key==='strength'){
    const si=document.getElementById(`pst-${k}-${slot}`);
    if(si){if(slot===1)e.subtype=si.value.trim();else e.subtype2=si.value.trim();}
  }
  closePicker();save();renderCal();
  toast('✓ Saved','#1252a3');
}
function clearDay(k){delete DB[k];closePicker();save();renderCal();}
function removeSecond(k){
  if(DB[k]){delete DB[k].type2;delete DB[k].exercises2;delete DB[k].pool2;delete DB[k].subtype2;}

}
function copyD(k){clip=JSON.parse(JSON.stringify(DB[k]||{}));toast('Copied! ⧉','#1252a3');renderCal();}
function pasteD(k){if(!clip)return;DB[k]=JSON.parse(JSON.stringify(clip));save();toast('Pasted! ✓','#27ae60');renderCal();}
function clearExValues(entry){
  const e=JSON.parse(JSON.stringify(entry));
  if(e.exercises)e.exercises=e.exercises.map(ex=>({...ex,sets:ex.sets.map(()=>({val:'',rest:''})),extra:''}));
  if(e.exercises2)e.exercises2=e.exercises2.map(ex=>({...ex,sets:ex.sets.map(()=>({val:'',rest:''})),extra:''}));
  if(e.pool)e.pool={warmUp:'',training:'',coolDown:'',meters:'',time:'',pace:''};
  if(e.pool2)e.pool2={warmUp:'',training:'',coolDown:'',meters:'',time:'',pace:''};
  e.done=false;
  return e;
}
function fillMonth(){
  const y=cur.getFullYear(),m=cur.getMonth(),days=dim(y,m),pat={};
  for(let d=1;d<=7;d++){const dw=gdow(new Date(y,m,d));const k=mk(y,m,d);if(DB[k])pat[dw]=DB[k];}
  if(!Object.keys(pat).length){toast(t('noSessions')||'Set at least one week first!','#e74c3c');return;}
  for(let d=1;d<=days;d++){
    const dw=gdow(new Date(y,m,d));const k=mk(y,m,d);
    if(pat[dw]&&!DB[k])DB[k]=clearExValues(pat[dw]);
  }
  save();toast(t('fillMonth')||'Month filled! ☁','#1a7ab5');renderCal();
}

function doDeleteView(){
  const ov=document.getElementById('confirmOverlay');if(ov)ov.remove();
  if(mode==='month'){
    const y=cur.getFullYear(),m=cur.getMonth();
    Object.keys(DB).forEach(k=>{const{y:ky,m:km}=pk(k);if(ky===y&&km===m)delete DB[k];});

  cats.forEach(cat=>{
    const T=TYPES[cat];

function selectCat(cat){
  trainCat=cat;trainSubtype=null;
  if(cat==='strength'){
    const subtypes=[...new Set(Object.values(DB).filter(v=>(v.type==='strength'&&v.subtype)||(v.type2==='strength'&&v.subtype2)).map(v=>v.subtype||v.subtype2))];
    if(!subtypes.length){renderSessionList('strength',null);return;}
    let h=`<div style="margin-bottom:18px;"><div style="font-size:11px;letter-spacing:3px;color:var(--str);font-weight:800;margin-bottom:12px;">${t('selectStrength')}</div>`;
    h+=`<div class="subtype-grid"><button class="subtype-btn active" onclick="selectSubtype(null)">${t('allStrength')}</button>`;
    subtypes.forEach(st=>{h+=`<button class="subtype-btn" onclick="selectSubtype('${esc(st)}')">${esc(st)}</button>`;});
    h+=`</div></div>`;
    document.getElementById('trainContent').innerHTML=h;
    renderSessionList('strength',null);
  } else {renderSessionList(cat,null);}
}
function selectSubtype(st){

}

function renderSessionList(cat,subtype){
  let sessions=Object.entries(DB).filter(([,v])=>v.type===cat||v.type2===cat);
  if(cat==='strength'&&subtype)sessions=sessions.filter(([,v])=>(v.subtype===subtype)||(v.subtype2===subtype));
  sessions=sessions.sort(([a],[b])=>b.localeCompare(a));
  const T=TYPES[cat];
  let h=`<div class="sess-list">`;
  if(!sessions.length){h+=`<div style="color:var(--text3);font-size:14px;padding:24px 0;font-weight:600">${t('noSessions')}</div></div>`;
    const ex=document.getElementById('trainContent').innerHTML;
    const idx=ex.indexOf('<div class="sess-list">');
    document.getElementById('trainContent').innerHTML=(idx>-1?ex.substring(0,idx):ex)+h;return;}

  sessions.forEach(([k,v],idx)=>{
    const{y,m,d}=pk(k),dt=new Date(y,m,d);
    const mns=(lang==='es'&&T_ES.months)||MONTHS;
    const ds=t((['mon','tue','wed','thu','fri','sat','sun'])[gdow(dt)]).toUpperCase()+' · '+String(d).padStart(2,'0')+' '+mns[m].slice(0,3).toUpperCase()+' '+y;

    const subtype2=slot===1?v.subtype:v.subtype2;
    h+=`<div class="sess-card">`;
    h+=`<div class="sess-head" onclick="toggleSess('sess-${idx}')">`;
    h+=`<div><div class="sess-date" style="color:${T.color}">${ds}</div>`;
    h+=`<div class="sess-name" style="color:${T.color}">${cat==='strength'&&subtype2?esc(subtype2):t(cat)+' '+t('session')}</div></div>`;
    h+=`<span class="sess-arrow" id="arr-sess-${idx}">›</span></div>`;
    h+=`<div class="sess-body" id="sess-${idx}">`;
    const exs=slot===1?v.exercises||[]:v.exercises2||[];
    const pool=slot===1?v.pool:v.pool2;
    if(cat==='pool'){h+=renderPoolTable(sessions,idx,slot);}
    else{
      exs.forEach((ex,ei)=>{
        const allDates=sessions.map(([dk,dv])=>{
          const sl=dv.type===cat?1:2;
          const exArr=sl===1?dv.exercises||[]:dv.exercises2||[];
          const ex2=exArr.find(x=>x.name===ex.name);
          return ex2?{key:dk,sets:ex2.sets,extra:ex2.extra}:null;
        }).filter(Boolean).sort((a,b)=>a.key.localeCompare(b.key));
        h+=`<div class="ex-group">`;
        h+=`<div class="ex-group-head" onclick="toggleExGroup('exg-${idx}-${ei}')">`;
        h+=`<span class="ex-group-name" style="color:${T.color}">${esc(ex.name)}</span>`;
        h+=`<span class="ex-group-arrow" id="arr-exg-${idx}-${ei}">›</span></div>`;
        h+=`<div class="ex-dates-list" id="exg-${idx}-${ei}">`;
        h+=`<div class="ex-date-row" style="background:var(--bg2);font-weight:800;font-size:10px;letter-spacing:2px;color:var(--text3)"><span>${t('date')}</span><span>${t('sets')}</span><span>REST</span><span>${t('extra')}</span></div>`;
        allDates.forEach((ad,adi)=>{
          const{y:ay,m:am,d:ad2}=pk(ad.key);
          const dstr=String(ad2).padStart(2,'0')+'/'+String(am+1).padStart(2,'0')+'/'+ay;
          const isCur=ad.key===k;const prevAd=adi>0?allDates[adi-1]:null;
          h+=`<div class="ex-date-row" style="${isCur?'background:'+T.bg+';border-left:3px solid '+T.color:''}">`;
          h+=`<span class="ex-date-lbl"${isCur?' style="color:'+T.color+';font-weight:800"':''}>${dstr}${isCur?' ★':''}</span>`;

          ad.sets.forEach((s,si)=>{const ps=prevAd?.sets[si];const prog=ps?cmpS(s.val,ps.val):'n';h+=`<span class="set-tag${prog==='u'?' up':prog==='d'?' down':''}">${esc(s.val||'—')}</span>`;});
          h+=`</span><span style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--text3)">${esc(ad.sets[0]?.rest||'—')}</span>`;
          h+=`<span style="font-size:10px;color:var(--text3)">${esc(ad.extra||'')}</span></div>`;
        });
        h+=`</div></div>`;
      });
      h+=`<button class="btn primary btn sm" style="margin-top:10px" onclick="openDay('${k}',${slot})">Edit Session →</button>`;
    }
    h+=`</div></div>`;
  });
  h+='</div>';
  const ex=document.getElementById('trainContent').innerHTML;
  const idx=ex.indexOf('<div class="sess-list">');
  document.getElementById('trainContent').innerHTML=(idx>-1?ex.substring(0,idx):ex)+h;
}

function renderPoolTable(sessions,currentIdx,slot){
  const fields=[['warmUp','Warm Up'],['training','Training'],['coolDown','Cool Down'],['meters','Meters'],['time','Time'],['pace','Pace']];
  const sorted=sessions.map(([k,v])=>({k,pool:(slot===1?v.pool:v.pool2)||{}})).sort((a,b)=>a.k.localeCompare(b.k));
  let h=`<div style="overflow-x:auto;margin-top:10px"><table class="pool-table"><thead><tr><th>${t('field')}</th>`;
  sorted.forEach(({k},si)=>{const{y,m,d}=pk(k);const isCur=si===currentIdx;h+=`<th style="${isCur?'background:var(--pool);color:#fff;':''}">${String(d).padStart(2,'0')}/${String(m+1).padStart(2,'0')}/${y}${isCur?' ★':''}</th>`;});
  h+='</tr></thead><tbody>';
  fields.forEach(([f,label])=>{
    h+=`<tr><td style="font-weight:800;color:var(--pool);letter-spacing:1px;">${label}</td>`;
    sorted.forEach(({k,pool},si)=>{
      const isCur=si===currentIdx;
      if(isCur){
        h+=`<td style="background:var(--pool-bg);padding:4px;"><input value="${esc(pool[f]||'')}" placeholder="—" onchange="updatePoolFromTraining('${k}',${slot},'${f}',this.value)" style="width:80px;padding:4px 6px;font-size:11px;font-family:'JetBrains Mono',monospace;border:1.5px solid var(--pool);border-radius:5px;background:var(--surface);color:var(--pool);font-weight:700;"></td>`;
      } else {h+=`<td>${esc(pool[f]||'—')}</td>`;}
    });
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
function updatePoolFromTraining(k,slot,field,val){
  if(!DB[k])DB[k]={type:'pool'};
  const poolKey=slot===1?'pool':'pool2';
  if(!DB[k][poolKey])DB[k][poolKey]={};
  DB[k][poolKey][field]=val;save();
}

function openDay(k,slot){selKey=k;selSlot=slot||1;renderWorkout();showView('workout');}
function goBack(){showView(backTo);}

function renderWorkout(){
  const k=selKey,slot=selSlot,e=DB[k]||{};
  const type=slot===1?e.type:e.type2;
  const T=TYPES[type]||TYPES.strength;
  const{y,m,d}=pk(k),dt=new Date(y,m,d);
  const mnsW=(lang==='es'&&T_ES.months)||MONTHS;
  document.getElementById('wkDate').textContent=t((['mon','tue','wed','thu','fri','sat','sun'])[gdow(dt)]).toUpperCase()+' · '+String(d).padStart(2,'0')+' '+mnsW[m].slice(0,3).toUpperCase()+' '+y;
  const sub=slot===1?e.subtype:e.subtype2;
  if(sub && type==='strength'){
    document.getElementById('wkType').innerHTML=T.icon+' '+t(type||'strength')+' <span style="color:'+T.color+';font-size:0.75em;font-weight:800;letter-spacing:2px;opacity:.9">'+sub+'</span>';
  } else {
    document.getElementById('wkType').textContent=T.icon+' '+t(type||'strength');
  }
  document.getElementById('wkType').style.color=T.color;
  document.getElementById('wkName').textContent='';
  const pk2=prevSess(k,type,slot);
  document.getElementById('wkPrev').textContent=pk2?'vs '+pk2:'';
  if(type==='pool')renderPool(e,pk2,slot);else renderGym(e,pk2,T,slot);
}

function renderGym(e,pk2,T,slot){
  const exs=slot===1?e.exercises||[]:e.exercises2||[];
  const prevE=pk2?DB[pk2]:null;
  const pexs=prevE?(slot===1?prevE.exercises||[]:prevE.exercises2||[]):[];
  let h='';
  exs.forEach((ex,ei)=>{
    const pe=pexs.find(x=>x.name===ex.name);
    h+=`<div class="excard" style="border-color:${T.color}44">`;
    h+=`<div class="exhead"><input class="exname" style="color:${T.color}" value="${esc(ex.name)}" onchange="updExName(${ei},this.value,${slot})"><button class="btn sm danger" onclick="remEx(${ei},${slot})">✕</button></div>`;
    h+=`<div class="shdr"><span>#</span><span>${t('weightReps')}</span><span>REST</span><span>LAST</span><span></span></div>`;
    ex.sets.forEach((s,si)=>{
      const ps=pe?.sets[si],vp=ps?cmpS(s.val,ps.val):'n',rp=ps?cmpR(s.rest,ps.rest):'n';
      h+=`<div class="srow"><span class="slbl">S${si+1}</span>`;
      h+=`<div class="swrap"><input class="sinp${bc(vp)}" value="${esc(s.val)}" placeholder="60x10" onchange="updSet(${ei},${si},'val',this.value,${slot})">${arrHTML(vp)}</div>`;
      h+=`<div class="swrap"><input class="sinp${bc(rp)}" value="${esc(s.rest)}" placeholder="90" onchange="updSet(${ei},${si},'rest',this.value,${slot})">${arrHTML(rp)}</div>`;
      h+=`<span class="sprev">${esc(ps?.val||'—')}</span>`;
      h+=`<button class="micro" style="color:#e74c3c" onclick="remSet(${ei},${si},${slot})">✕</button></div>`;
    });
    h+=`<div class="exfooter"><button class="btn sm" onclick="addSet(${ei},${slot})">${t('addSet')}</button><input class="extrain" value="${esc(ex.extra||'')}" placeholder="${t('extraPlaceholder')||'Extra notes...'}" onchange="updExtra(${ei},this.value,${slot})"></div>`;
    h+=`</div>`;
  });
  h+=`<div style="margin-top:10px"><button class="btn primary" onclick="addEx(${slot})">+ Add Exercise</button></div>`;
  if(pk2&&T.prog){
    let u=0,dw=0,n=0;
    exs.forEach(ex=>{const pe=pexs.find(x=>x.name===ex.name);if(!pe)return;ex.sets.forEach((s,si)=>{const r=cmpS(s.val,pe.sets[si]?.val);if(r==='u')u++;else if(r==='d')dw++;else n++;});});
    const tot=u+dw+n;
    if(tot>0){
      h+=`<div class="psumm"><div class="psttl">${t('sessionProgress')||'SESSION PROGRESS VS PREVIOUS'}</div><div class="psrow">`;
      h+=`<div class="psstat"><div class="psnum" style="color:#27ae60">${u}</div>${t('improved')}</div>`;
      h+=`<div class="psstat"><div class="psnum" style="color:var(--text3)">${n}</div><div class="pslbl" style="color:var(--text3)">${t('same')}</div></div>`;
      h+=`<div class="psstat"><div class="psnum" style="color:#e74c3c">${dw}</div><div class="pslbl" style="color:#e74c3c">${t('declined')}</div></div>`;
      h+=`<div class="psbar"><div style="width:${(u/tot)*100}%;background:#27ae60"></div><div style="width:${(n/tot)*100}%;background:var(--border)"></div><div style="width:${(dw/tot)*100}%;background:#e74c3c"></div></div>`;
      h+='</div></div>';
    }
  }
  document.getElementById('wkBody').innerHTML=h;
}

function renderPool(e,pk2,slot){
  const pool=(slot===1?e.pool:e.pool2)||{};
  const prevPool=pk2?(slot===1?DB[pk2]?.pool:DB[pk2]?.pool2)||{}:{};
  const fields=[['warmUp',t('warmUp'),'e.g. 100x3'],['training',t('training2'),'e.g. 1000x2'],['coolDown',t('coolDown'),'e.g. 150x2'],['meters',t('meters'),'e.g. 2000'],['time',t('time'),'e.g. 10-40-10'],['pace',t('pace'),'auto']];
  let h=`<div class="poolcard">`;
  fields.forEach(([f,l,p])=>{h+=`<div class="pfield"><span class="plbl">${l}</span><input class="pinp" value="${esc(pool[f]||'')}" placeholder="${p}" onchange="updPool('${f}',this.value,${slot})"><span class="pprev">${esc(prevPool[f]||'—')}</span></div>`;});
  if(pk2)h+=`<div style="font-size:10px;color:var(--text3);letter-spacing:2px;margin-top:8px;font-weight:700">↑ ${t('prevSession')} (${pk2})</div>`;
  h+='</div>';
  document.getElementById('wkBody').innerHTML=h;
}

function getE(){return DB[selKey]||{};}
function mutSlot(fn,slot){

function addToLibrary(slot){
  const nameInp=document.getElementById('libExInput');
  const catSel=document.getElementById('libCatSelect');
  const name=nameInp?nameInp.value.trim():'';
  const cat=catSel?catSel.value:'pierna';
  if(!name)return;
  // Add to runtime library
  if(EXERCISE_LIBRARY[cat]&&!EXERCISE_LIBRARY[cat].exercises.includes(name)){
    EXERCISE_LIBRARY[cat].exercises.push(name);
    // Save custom exercises to localStorage
    try{
      const saved=JSON.parse(localStorage.getItem('ns-custom-exercises')||'{}');
      if(!saved[cat])saved[cat]=[];
      if(!saved[cat].includes(name))saved[cat].push(name);
      localStorage.setItem('ns-custom-exercises',JSON.stringify(saved));
    }catch(_){}
    // Refresh picker
    const lbl=lang==='es'?EXERCISE_LIBRARY[cat].label.es:EXERCISE_LIBRARY[cat].label.en;
    toast('💾 '+(lang==='es'?`Añadido a ${lbl}`:`Added to ${lbl}`),'#27ae60');
    closeExPicker();
    showExPicker(slot);
  } else {
    toast(lang==='es'?'Ya existe en la biblioteca':'Already in library','#e74c3c');
  }
}

function loadCustomExercises(){
  try{
    const saved=JSON.parse(localStorage.getItem('ns-custom-exercises')||'{}');
    Object.entries(saved).forEach(([cat,exs])=>{
      if(EXERCISE_LIBRARY[cat]){
        exs.forEach(ex=>{if(!EXERCISE_LIBRARY[cat].exercises.includes(ex))EXERCISE_LIBRARY[cat].exercises.push(ex);});
      }
    });
  }catch(_){}
}

function renderProgress(){
  renderProgCatCards();
  const ss=Object.entries(DB).filter(([,v])=>v.type===pType||v.type2===pType).sort(([a],[b])=>a.localeCompare(b));
  const exns=pType!=='pool'?[...new Set(ss.flatMap(([,v])=>{
    const r=[];
    if(v.type===pType)(v.exercises||[]).forEach(e=>r.push(e.name));
    if(v.type2===pType)(v.exercises2||[]).forEach(e=>r.push(e.name));
    return r;
  }))]:['Meters','Training','Time'];
  if(!pEx||!exns.includes(pEx))pEx=exns[0]||null;
  const T=TYPES[pType];
  document.getElementById('exList').innerHTML=exns.map(n=>{
    const ac=n===pEx;
    return `<button class="exlbtn${ac?' active':''}" style="${ac?'border-color:'+T.color+';color:'+T.color+';background:'+T.bg:''}" onclick="setPEx('${n.replace(/'/g,"\\'")}') ">${esc(n.toUpperCase())}</button>`;
  }).join('');
  renderChart(ss,T);
}
function setPT(t){pType=t;pEx=null;renderProgress();}
function setPEx(n){pEx=n;renderProgress();}

function renderChart(ss,T){
  const el=document.getElementById('chartBox');
  if(!pEx){el.innerHTML=`<div style="color:var(--text3);font-size:14px;font-weight:600">${t('selectExercise')}</div>`;return;}
  let cd=[];
  if(pType==='pool'){
    const f=pEx.toLowerCase();
    cd=ss.map(([k,v])=>{
      const pool=v.type===pType?v.pool:v.pool2;
      return{date:k.slice(5),raw:pool?.[f]||'',score:+pool?.[f]||0};
    }).filter(d=>d.raw);
  } else {
    cd=ss.map(([k,v])=>{
      const exs=v.type===pType?v.exercises||[]:v.exercises2||[];
      const ex=exs.find(e=>e.name===pEx);if(!ex)return null;
      let best=0;ex.sets.forEach(s=>{const p=parseS(s.val);if(p)best=Math.max(best,(p.w||1)*p.r);});
      return{date:k.slice(5),score:best,raw:ex.sets[0]?.val||''};
    }).filter(Boolean);
  }
  if(!cd.length){el.innerHTML=`<div class="chtitle" style="color:${T.color}">${esc(pEx.toUpperCase())}</div><div style="color:var(--text3);font-size:14px;font-weight:600">${t('noSessions')}</div>`;return;}
  const mx=Math.max(...cd.map(d=>d.score),1);
  let bars='<div class="barchart">';
  cd.forEach((d,i)=>{
    const pv=cd[i-1],tr=pv?(d.score>pv.score?'u':d.score<pv.score?'d':'n'):'n';
    const col=tr==='u'?'#27ae60':tr==='d'?'#e74c3c':T.color;
    const h2=Math.max(4,(d.score/mx)*128);
    bars+=`<div class="bwrap"><div class="bvlbl" style="color:${col};background:${col}20;padding:2px 6px;border-radius:5px;">${esc(d.raw)}</div><div class="bseg" style="height:${h2}px;background:${col}">${tr==='u'?'<div class="barrow" style="color:#27ae60;font-size:12px;">▲</div>':tr==='d'?'<div class="barrow" style="color:#e74c3c;font-size:12px;">▼</div>':''}</div></div>`;
  });
  bars+='</div>';
  const dates='<div class="drow">'+cd.map(d=>`<div class="dcell">${esc(d.date)}</div>`).join('')+'</div>';
  let stats='';
  if(cd.length>1){
    const best=cd.reduce((a,b)=>b.score>a.score?b:a),last=cd[cd.length-1];
    stats=`<div class="chstats"><div><div class="cslbl">${t('sessions')}</div><div class="csval">${cd.length}</div></div><div><div class="cslbl">${t('best')}</div><div class="csval" style="color:${T.color}">${esc(best.raw)}</div></div><div><div class="cslbl">${t('latest')}</div><div class="csval">${esc(last.raw)}</div></div><div><div class="cslbl">${t('trend')}</div><div class="csval" style="font-size:15px">${last.score>cd[0].score?'📈 UP':'📉 DOWN'}</div></div></div>`;
  }
  el.innerHTML=`<div class="chtitle" style="color:${T.color}">${esc(pEx.toUpperCase())}</div>${bars}${dates}${stats}`;
}


/* ── INIT ── */
(async function init(){
  try{
    const s=localStorage.getItem('ns-theme');
    if(s==='dark'){
      dark=true;
      document.documentElement.setAttribute('data-theme','dark');
      document.getElementById('themeBtn').classList.add('dark');
      document.getElementById('themeLabel').textContent=t('dark');
      const mb=document.getElementById('mobileThemeBtn');if(mb)mb.textContent='🌙';
    }
  }catch(_){}
  try{
    const l=localStorage.getItem('ns-lang');
    if(l==='es'){lang='es';document.getElementById('langBtn').textContent='ES';}
  }catch(_){}
  loadCustomExercises();
  await load();
  applyLang();
  renderCal();
})();
</script>
